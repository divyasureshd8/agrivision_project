
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision - Smart Farming</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>🌱 AgriVision</h1>
    <p>Smart Agriculture and Crop Recommendation System</p>
</header>

<main>
    <section>
        <h2>Regional Crop Recommendation</h2>
        <label for="district">Select Karnataka District:</label>
        <select id="district">
            <option value="">Select District</option>
            <option>Bagalkot</option>
            <option>Ballari</option>
            <option>Belagavi</option>
            <option>Bengaluru Rural</option>
            <option>Bengaluru Urban</option>
            <option>Bidar</option>
            <option>Chamarajanagar</option>
            <option>Chikkaballapur</option>
            <option>Chikkamagaluru</option>
            <option>Chitradurga</option>
            <option>Dakshina Kannada</option>
            <option>Davanagere</option>
            <option>Dharwad</option>
            <option>Gadag</option>
            <option>Hassan</option>
            <option>Haveri</option>
            <option>Kalaburagi</option>
            <option>Kodagu</option>
            <option>Kolar</option>
            <option>Koppal</option>
            <option>Mandya</option>
            <option>Mysuru</option>
            <option>Raichur</option>
            <option>Ramanagara</option>
            <option>Shivamogga</option>
            <option>Tumakuru</option>
            <option>Udupi</option>
            <option>Uttara Kannada</option>
            <option>Vijayapura</option>
            <option>Vijayanagara</option>
            <option>Yadgir</option>
        </select>
        <button onclick="showRegionalCrops()">Show Regional Crops</button>
        <div id="regionalResult"></div>
    </section>

    <section>
        <h2>AI Crop Recommendation</h2>
        <p>Enter your soil and climate details.</p>

        <label>Nitrogen (N)</label>
        <input type="number" id="nitrogen" placeholder="Enter Nitrogen">

        <label>Phosphorus (P)</label>
        <input type="number" id="phosphorus" placeholder="Enter Phosphorus">

        <label>Potassium (K)</label>
        <input type="number" id="potassium" placeholder="Enter Potassium">

        <label>Temperature (°C)</label>
        <input type="number" id="temperature" step="any" placeholder="Enter Temperature">

        <label>Humidity (%)</label>
        <input type="number" id="humidity" step="any" placeholder="Enter Humidity">

        <label>Soil pH</label>
        <input type="number" id="ph" step="any" placeholder="Enter Soil pH">

        <label>Rainfall (mm)</label>
        <input type="number" id="rainfall" step="any" placeholder="Enter Rainfall">

        <button id="predictCrop">Predict Best Crop</button>
        <div id="predictionResult"></div>
    </section
<h2>Crop-wise NPK recommendation </h2>
    <label>select crop</label>
    <select id-"Cropselect">
     <option value="">Choose a Crop</opinion>
        <option>Rice</option>
       <option>Wheat</option>
        <option>Maize</option>
        <option>Cotton</option>
        <option>Sugarcane</option>
        <option>Ragi</option>
        <option>Groundnut</option>
        <option>Tomato</option>
        <option>Potato</option>
        <option>Banana</option>
        <option>Coffee</option>
        <option>Arecanut</option>
        <option>Pepper</option>
        <option>Cardamom</option>
        <option>Coconut</option>
        <option>Chilli</option>
        <option>Onion</option>
        <option>Soybean</option>
        <option>Turmeric</option>
        <option>Mango</option>
    </select>

    <div id="npkResult">
        Select a crop to see NPK values.
    </div>
</section>

</main>

<footer>
    <p>AgriVision - Empowering Farmers with AI 🌾</p>
</footer>

<script src="script.js"></script>
    <script src="script.js"></script>
</body>
  </html>
