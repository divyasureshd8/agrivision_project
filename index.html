.row{display:flex;gap:8px;margin-bottom:8px}
.row button{flex:1;padding:8px;font-size:15px;margin:0}
#msg{font-size:13px;color:#555;margin:6px 0 14px;min-height:16px}
.alt{margin-top:8px;color:#555;line-height:1.6}
details{border-bottom:1px solid #eee;padding:8px 0}
summary{font-size:17px;color:#1b1b1b}
.info{font-size:14px;color:#444;line-height:1.8;padding:6px 0 4px 8px}
.info b{color:#2e7d32}
footer{text-align:center;font-size:12px;color:#777;padding:0 12px 20px}

'Bagalkote':'ಬಾಗಲಕೋಟೆ','Ballari':'ಬಳ್ಳಾರಿ','Belagavi':'ಬೆಳಗಾವಿ','Bengaluru North':'ಬೆಂಗಳೂರು ಉತ್ತರ',
'Bengaluru South':'ಬೆಂಗಳೂರು ದಕ್ಷಿಣ','Bengaluru Urban':'ಬೆಂಗಳೂರು ನಗರ','Bidar':'ಬೀದರ್','Chamarajanagar':'ಚಾಮರಾಜನಗರ',
'Chikkaballapura':'ಚಿಕ್ಕಬಳ್ಳಾಪುರ','Chikkamagaluru':'ಚಿಕ್ಕಮಗಳೂರು','Chitradurga':'ಚಿತ್ರದುರ್ಗ','Dakshina Kannada':'ದಕ್ಷಿಣ ಕನ್ನಡ',
'Davanagere':'ದಾವಣಗೆರೆ','Dharwad':'ಧಾರವಾಡ','Gadag':'ಗದಗ','Hassan':'ಹಾಸನ','Haveri':'ಹಾವೇರಿ','Kalaburagi':'ಕಲಬುರಗಿ',
'Kodagu':'ಕೊಡಗು','Kolar':'ಕೋಲಾರ','Koppal':'ಕೊಪ್ಪಳ','Mandya':'ಮಂಡ್ಯ','Mysuru':'ಮೈಸೂರು','Raichur':'ರಾಯಚೂರು',
'Shivamogga':'ಶಿವಮೊಗ್ಗ','Tumakuru':'ತುಮಕೂರು','Udupi':'ಉಡುಪಿ','Uttara Kannada':'ಉತ್ತರ ಕನ್ನಡ',
'Vijayanagara':'ವಿಜಯನಗರ','Vijayapura':'ವಿಜಯಪುರ','Yadgir':'ಯಾದಗಿರಿ'
};

// Not official rankings. Only Hassan and Chikkamagaluru were checked against sources.
const DISTRICTS={
'Bagalkote':'jowar,maize,wheat,sugarcane,pigeon pea,chickpea',
'Ballari':'rice,cotton,jowar,maize,chilli',
'Belagavi':'sugarcane,maize,jowar,soybean,rice',
'Bengaluru North':'ragi,maize,grapes,vegetables,mulberry',
'Bengaluru South':'ragi,mulberry,mango,coconut,banana',
'Bengaluru Urban':'ragi,vegetables,mango,grapes',
'Bidar':'soybean,pigeon pea,chickpea,jowar,sugarcane',
'Chamarajanagar':'maize,sugarcane,turmeric,banana,ragi',
'Chikkaballapura':'ragi,maize,grapes,mulberry,vegetables',
'Chikkamagaluru':'coffee,arecanut,black pepper,rice,coconut,cardamom,tea',
'Chitradurga':'maize,groundnut,ragi,onion,coconut,arecanut',
'Dakshina Kannada':'arecanut,coconut,rice,black pepper,cashew,rubber',
'Davanagere':'maize,rice,arecanut,cotton',
'Dharwad':'cotton,maize,soybean,wheat,chilli,chickpea',
'Gadag':'maize,green gram,onion,sunflower,chickpea,jowar',
'Hassan':'ragi,coconut,potato,rice,sugarcane,maize,coffee,black pepper',
'Haveri':'maize,cotton,rice,chilli,groundnut',
'Kalaburagi':'pigeon pea,jowar,chickpea,cotton,sugarcane',
'Kodagu':'coffee,black pepper,rice,cardamom,orange',
'Kolar':'ragi,tomato,mango,mulberry,vegetables',
'Koppal':'rice,maize,pearl millet,pomegranate,chickpea',
'Mandya':'sugarcane,rice,ragi,coconut,mulberry',
'Mysuru':'rice,ragi,sugarcane,tobacco,cotton,maize',
'Raichur':'rice,cotton,pigeon pea,jowar,chickpea',
'Shivamogga':'arecanut,rice,maize,black pepper,ginger',
'Tumakuru':'coconut,arecanut,ragi,groundnut,mango',
'Udupi':'rice,coconut,arecanut,cashew,black pepper',
'Uttara Kannada':'arecanut,rice,coconut,black pepper,banana',
'Vijayanagara':'maize,rice,jowar,cotton,sugarcane',
'Vijayapura':'jowar,pigeon pea,chickpea,grapes,sugarcane,pomegranate',
'Yadgir':'rice,cotton,pigeon pea,jowar,groundnut'
};
// Old or alternative spellings
const OTHER_NAMES={bagalkot:'Bagalkote',bellary:'Ballari',belgaum:'Belagavi',bangalore:'Bengaluru Urban','bangalore urban':'Bengaluru Urban',bengaluru:'Bengaluru Urban','bangalore rural':'Bengaluru North','bengaluru rural':'Bengaluru North',ramanagara:'Bengaluru South',ramanagaram:'Bengaluru South',chamrajanagar:'Chamarajanagar',chamarajanagara:'Chamarajanagar',chikkaballapur:'Chikkaballapura',chikballapur:'Chikkaballapura',chikmagalur:'Chikkamagaluru',davangere:'Davanagere',dharwada:'Dharwad',gadaga:'Gadag',gulbarga:'Kalaburagi',coorg:'Kodagu',koppala:'Koppal',mysore:'Mysuru',raichuru:'Raichur',shimoga:'Shivamogga',tumkur:'Tumakuru',bijapur:'Vijayapura',yadagiri:'Yadgir'};
// Extra spellings that speech recognition often produces
const VOICE_ALIASES={hasan:'Hassan',kalburgi:'Kalaburagi',chikmangalur:'Chikkamagaluru','dakshin kannada':'Dakshina Kannada','uttar kannada':'Uttara Kannada',banglore:'Bengaluru Urban',mangalore:'Dakshina Kannada',hubli:'Dharwad'};
const CHECKED=['Hassan','Chikkamagaluru'];

let lang='en';
try{lang=localStorage.getItem('lang')==='kn'?'kn':'en'}catch(e){}
let msgKey='intro',msgArg='',outOpen=false,view={k:'d'};

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const t=k=>T[lang][k];
const cropName=c=>lang==='kn'?(CROPS_KN[c]||cap(c)):cap(c);
const distName=d=>lang==='kn'?(DISTRICTS_KN[d]||d):d;

function setMsg(k,arg){msgKey=k;msgArg=arg||'';renderMsg()}
function renderMsg(){
const m=$('msg');
if(msgKey==='found')m.textContent=t('found')+distName(msgArg)+t('check');
else if(msgKey==='heard')m.textContent=t('heard')+msgArg;
else m.textContent=t(msgKey);
}

function buildSelect(){
const s=$('district'),cur=s.value;
s.innerHTML='';
s.add(new Option(t('pick'),''));
Object.keys(DISTRICTS).forEach(d=>s.add(new Option(distName(d),d)));
s.value=cur;
}

function setLang(l){
stopSpeak();
lang=l;
try{localStorage.setItem('lang',l)}catch(e){}
document.documentElement.lang=l;
$('b-en').className=l==='en'?'on':'';
$('b-kn').className=l==='kn'?'on':'';
$('sub').textContent=t('sub');
$('locBtn').textContent=t('locBtn');
$('micBtn').textContent=t('micBtn');
$('distLabel').textContent=t('distLabel');
$('showBtn').textContent=t('showBtn');
$('foot').innerHTML=t('foot');
buildSelect();
renderMsg();
if(outOpen){if(view.k==='c')showCrop(view.c);else show()}
}

function matchDistrict(name){
const n=String(name||'').toLowerCase().replace(/\bdistrict\b/g,'').trim();
return OTHER_NAMES[n]||Object.keys(DISTRICTS).find(d=>d.toLowerCase()===n)||'';
}

function seasonLine(c){
const s=SEASONS[c];
if(!s)return '';
const names=s.split('').map(k=>SEASON_NAMES[lang][k]).join(', ');
return '📅 <b>'+t('season')+':</b> '+names+'<br>';
}

function infoHTML(c){
const btn='<br><button class="sm" onclick="speakCrop(\''+c+'\')">'+t('listenBtn')+'</button>';
const i=INFO[c];
if(!i)return '<div class="info">'+seasonLine(c)+t('noInfo')+btn+'</div>';
const n=i[8];
const npk=n?n[0]+' : '+n[1]+' : '+n[2]+' '+UNITS[lang][n[3]]:t('varies');
return '<div class="info">'+seasonLine(c)+
'🌡️ <b>'+t('temp')+':</b> '+i[0]+'–'+i[1]+' °C<br>'+
'💧 <b>'+t('hum')+':</b> '+i[2]+'–'+i[3]+' %<br>'+
'🌧️ <b>'+t('rain')+':</b> '+i[4]+'–'+i[5]+' mm<br>'+
'🧪 <b>pH:</b> '+i[6]+'–'+i[7]+'<br>'+
'🌱 <b>'+t('npk')+':</b> '+npk+btn+'</div>';
}

function show(){
const o=$('out'),d=$('district').value;
view={k:'d'};
o.style.display='block';outOpen=true;
if(!d){o.innerHTML=t('choose');return}
const list=DISTRICTS[d].split(',').map(c=>'<details><summary>'+(E[c]||'🌱')+' '+cropName(c)+'</summary>'+infoHTML(c)+'</details>');
const note=CHECKED.includes(d)?t('checked'):t('unver');
o.innerHTML='<div class="row"><button onclick="readList()">'+t('listenBtn')+'</button><button onclick="stopSpeak()">'+t('stopBtn')+'</button></div>'+
'<b>'+T[lang].title(distName(d))+'</b><div class="alt">'+list.join('')+'<small>'+t('tap')+'<br>'+note+'</small><br><small>'+t('infoNote')+'</small></div>';
}

function showCrop(c){
const o=$('out');
view={k:'c',c:c};
o.style.display='block';outOpen=true;
o.innerHTML='<div class="row"><button onclick="stopSpeak()">'+t('stopBtn')+'</button></div><b>'+(E[c]||'🌱')+' '+cropName(c)+'</b><div class="alt">'+infoHTML(c)+'<small>'+t('infoNote')+'</small></div>';
}

/* ---------- Voice: read aloud ---------- */
let voices=[];
function loadVoices(){if('speechSynthesis' in window)voices=speechSynthesis.getVoices()}
loadVoices();
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;

function speak(text){
if(!('speechSynthesis' in window)){setMsg('noTts');return}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
const code=lang==='kn'?'kn-IN':'en-IN';
u.lang=code;
const v=voices.find(x=>x.lang.replace('_','-').toLowerCase()===code.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang));
if(v)u.voice=v;
else if(voices.length&&t('noVoiceHint'))setMsg('noVoiceHint');
u.rate=0.9;
speechSynthesis.speak(u);
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}

function speechList(d){
return T[lang].title(distName(d))+'. '+DISTRICTS[d].split(',').map(cropName).join(', ');
}
function speechInfo(c){
const sp=SP[lang];
let s=cropName(c)+'. ';
const sn=SEASONS[c];
if(sn)s+=t('season')+': '+sn.split('').map(k=>SEASON_NAMES[lang][k].replace(/\s*\(.*?\)/g,'').replace(/\//g,',')).join(', ')+'. ';
const i=INFO[c];
if(!i)return s+t('noInfo');
s+=t('temp')+': '+sp.temp(i[0],i[1])+'. ';
s+=t('hum')+': '+sp.hum(i[2],i[3])+'. ';
s+=t('rain')+': '+sp.rain(i[4],i[5])+'. ';
s+=sp.phWord+': '+sp.ph(i[6],i[7])+'. ';
const n=i[8];
s+=n?sp.fert+': '+sp.n+' '+n[0]+', '+sp.p+' '+n[1]+', '+sp.k+' '+n[2]+', '+sp.units[n[3]]+'.':sp.fert+': '+t('varies')+'.';
return s;
}
function readList(){const d=$('district').value;if(d)speak(speechList(d))}
function speakCrop(c){speak(speechInfo(c))}

/* ---------- Voice: speak a district or crop name ---------- */
const DIST_KEYS=[];
Object.keys(DISTRICTS).forEach(d=>{DIST_KEYS.push([d.toLowerCase(),d]);DIST_KEYS.push([DISTRICTS_KN[d],d])});
Object.keys(OTHER_NAMES).forEach(k=>DIST_KEYS.push([k,OTHER_NAMES[k]]));
Object.keys(VOICE_ALIASES).forEach(k=>DIST_KEYS.push([k,VOICE_ALIASES[k]]));
const CROP_KEYS=[];
Object.keys(CROPS_KN).forEach(c=>{CROP_KEYS.push([c,c]);CROP_KEYS.push([CROPS_KN[c],c])});
// Longest name wins, e.g. "ಕಡಲೆಕಾಯಿ" beats "ಕಡಲೆ"
function best(list,s){
let b=null;
list.forEach(([k,v])=>{if(k&&s.includes(k)&&(!b||k.length>b[0].length))b=[k,v]});
return b&&b[1];
}

function handleVoice(alts){
const texts=alts.map(a=>a.toLowerCase().trim());
setMsg('heard',alts[0]);
for(const s of texts){
const d=best(DIST_KEYS,s);
if(d){$('district').value=d;show();speak(speechList(d));return}
}
for(const s of texts){
const c=best(CROP_KEYS,s);
if(c){showCrop(c);speak(speechInfo(c));return}
}
setMsg('noMatchVoice');
}

function listen(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){setMsg('noSpeech');return}
stopSpeak();
const r=new SR();
r.lang=lang==='kn'?'kn-IN':'en-IN';
r.interimResults=false;
r.maxAlternatives=3;
setMsg('listening');
r.onresult=e=>handleVoice(Array.from(e.results[0]).map(a=>a.transcript));
r.onerror=e=>setMsg(e.error==='not-allowed'||e.error==='service-not-allowed'?'micDenied':'noMatchVoice');
r.onend=()=>{if(msgKey==='listening')setMsg('noMatchVoice')};
try{r.start()}catch(e){setMsg('noMatchVoice')}
}

function loc(){
if(!navigator.geolocation){setMsg('noGeo');return}
setMsg('getting');
navigator.geolocation.getCurrentPosition(async pos=>{
try{
setMsg('finding');
const u='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=en&lat='+pos.coords.latitude+'&lon='+pos.coords.longitude;
const r=await fetch(u);
if(!r.ok)throw 0;
const a=(await r.json()).address||{};
if(a.state!=='Karnataka'){setMsg('notKa');return}
const d=matchDistrict(a.state_district||a.county);
if(!d){setMsg('noMatch');return}
$('district').value=d;
setMsg('found',d);
show();
}catch(e){setMsg('fail')}
},()=>setMsg('blocked'));
}

setLang(lang);
</script>
</body></html>
