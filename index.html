<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrivision</title>
<style>
body{font-family:sans-serif;max-width:420px;margin:20px auto;padding:0 16px}
input{width:100%;padding:8px;margin:4px 0 12px;box-sizing:border-box}
button{padding:10px 16px;background:#2e7d32;color:#fff;border:0;border-radius:6px}
#res{margin-top:16px;font-weight:bold}
</style></head><body>
<h1>Agrivision</h1>
<p>Basic crop recommendation</p>
Temperature (°C)<input id="t" type="number">
Humidity (%)<input id="h" type="number">
Rainfall (mm)<input id="r" type="number">
Soil pH<input id="p" type="number" step="0.1">
<button onclick="go()">Suggest crop</button>
<div id="res"></div>
<script>
const C={Rice:[20,35,60,100,150,300,5,7],Wheat:[10,25,40,70,50,100,6,7.5],
Maize:[18,30,50,80,60,110,5.5,7.5],Cotton:[22,35,50,80,60,120,6,8]};
function go(){
const v=['t','h','r','p'].map(i=>+document.getElementById(i).value);
let best='',s=-1;
for(const k in C){const c=C[k];let n=0;
for(let i=0;i<4;i++)if(v[i]>=c[2*i]&&v[i]<=c[2*i+1])n++;
if(n>s){s=n;best=k}}
document.getElementById('res').textContent='Suggested crop: '+best;
}
</script></body></html>
