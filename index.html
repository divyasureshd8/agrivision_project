<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrivision</title>
<style>
body{font-family:sans-serif;max-width:420px;margin:20px auto;padding:0 16px}
input{width:100%;padding:8px;margin:4px 0 12px;box-sizing:border-box}
button{padding:10px 16px;background:#2e7d32;color:#fff;border:0;border-radius:6px}
#res{margin-top:16px;font-weight:bold;line-height:1.6}
</style></head><body>
<h1>Agrivision</h1>
<p>Basic crop recommendation</p>
Temperature (°C)<input id="t" type="number">
Humidity (%)<input id="h" type="number">
Rainfall (mm)<input id="r" type="number">
Soil pH<input id="p" type="number" step="0.1">
<button onclick="go()">Suggest crop</button>
<div id="res"></div>
<script>
const C={
Rice:[20,35,60,100,150,300,5,7],
Wheat:[10,25,40,70,50,100,6,7.5],
Maize:[18,30,50,80,60,110,5.5,7.5],
Cotton:[22,35,50,80,60,120,6,8],
Sugarcane:[20,35,60,85,100,200,6,8],
Potato:[10,22,60,85,50,100,5,6.5],
Tomato:[18,30,50,75,60,120,6,7],
Banana:[22,35,70,90,100,250,5.5,7],
Coffee:[15,28,60,90,150,250,6,6.5],
Mango:[24,35,40,70,75,250,5.5,7.5],
Groundnut:[22,32,40,70,50,120,5.5,7],
Soybean:[20,30,50,80,60,120,6,7],
Millet:[25,35,30,60,40,90,5.5,7.5],
Apple:[5,20,50,80,100,200,5.5,6.5],
Chickpea:[10,25,30,60,40,90,6,8.5],
Jute:[24,37,70,90,150,250,6,7.5],
Tea:[13,30,70,90,150,300,4.5,5.5]};
function go(){
const v=['t','h','r','p'].map(i=>parseFloat(document.getElementById(i).value));
const o=document.getElementById('res');
if(v.some(isNaN)){o.textContent='Please fill all 4 boxes';return}
const out=[];
for(const k in C){const c=C[k];let s=0;
for(let i=0;i<4;i++){const lo=c[2*i],hi=c[2*i+1],m=(lo+hi)/2,w=(hi-lo)/2,d=Math.abs(v[i]-m)/w;s+=d<=1?2-d:-d}
out.push([k,s])}
out.sort((a,b)=>b[1]-a[1]);
o.innerHTML='Best: '+out[0][0]+'<br>Also good: '+out[1][0]+', '+out[2][0];
}
</script></body></html>
