<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrivision</title>
<style>
:root{--forest:#1f3d2b;--leaf:#3f7a4a;--sun:#f2b134;--clay:#c4552f;--cream:#fbf5e6;--paper:#fffdf7;--ink:#2a2418;--soil:#6b4a2f;--line:#e8dcc0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI','Noto Sans Kannada',Roboto,sans-serif;background-color:var(--cream);background-image:radial-gradient(rgba(107,74,47,.09) 1px,transparent 1.3px);background-size:16px 16px;color:var(--ink)}
header{position:relative;overflow:hidden;text-align:center;padding:30px 16px 78px;background:linear-gradient(180deg,#fff0c4 0%,#f8d37a 60%,#f2b134 100%)}
header::before{content:"";position:absolute;top:16px;right:6%;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d6,#ffd25e 55%,#f2a51a);box-shadow:0 0 0 9px rgba(255,255,255,.25),0 0 0 20px rgba(255,255,255,.14);animation:glow 4s ease-in-out infinite}
header h1,header p,.lang{position:relative}
header h1{margin:0;font-family:Georgia,'Noto Serif Kannada',serif;font-size:32px;letter-spacing:-.01em;color:var(--forest)}
header h1 span{color:var(--clay);font-style:italic}
header p{margin:6px 0 14px;color:var(--soil);font-size:15px}
.lang{display:inline-flex;gap:2px;padding:4px;background:rgba(255,255,255,.6);border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(31,61,43,.15)}
.lang button{width:auto;padding:7px 18px;font-size:15px;background:transparent;color:var(--forest);border-radius:999px;box-shadow:none;font-weight:600}
.lang button:active{transform:none}
.lang button.on{background:var(--forest);color:var(--cream)}
.hills{position:absolute;left:0;bottom:-1px;width:100%;height:64px;display:block}
main{max-width:440px;margin:-14px auto 30px;padding:0 16px;position:relative}
.card{position:relative;background:var(--paper);border:2px solid var(--line);border-top:8px solid var(--leaf);border-radius:20px;padding:18px;margin-top:18px;box-shadow:0 6px 0 rgba(107,74,47,.08),0 12px 24px rgba(107,74,47,.08);animation:rise .45s ease both}
main .card:nth-child(2){border-top-color:var(--soil)}
#out{border-top-color:var(--sun)}
#land{border-top:0;padding-top:32px}
#land::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:14px;border-radius:20px 20px 0 0;background:linear-gradient(90deg,#5a3d26 0 25%,#7d5738 25% 50%,#a07448 50% 75%,#c9a06a 75%)}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soil);margin-top:4px}
#soilTitle{font-family:Georgia,'Noto Serif Kannada',serif;font-size:19px;color:var(--forest)}
select,input{width:100%;padding:12px;margin:6px 0 14px;border:2px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:0;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(63,122,74,.18)}
button{width:100%;padding:14px;background:var(--forest);color:var(--cream);border:0;border-radius:999px;font-size:17px;font-weight:600;font-family:inherit;box-shadow:0 3px 0 #12261a;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #12261a}
button.loc{background:var(--paper);color:var(--forest);border:2px solid var(--forest);box-shadow:none;margin-bottom:10px}
#locBtn{background:var(--clay);color:#fff;border:0;box-shadow:0 3px 0 #8e3a1d;animation:ring 2.6s infinite}
button.sm{width:auto;padding:6px 16px;font-size:14px;margin-top:8px;background:var(--paper);color:var(--forest);border:2px solid var(--forest);box-shadow:none}
.row{display:flex;gap:8px;margin-bottom:10px}
.row button{flex:1;padding:9px;font-size:15px;box-shadow:none;background:var(--paper);color:var(--forest);border:2px solid var(--forest)}
.row input{flex:1;min-width:0}
#msg{font-size:13px;line-height:1.5;color:var(--soil);background:#f6efd6;border-left:4px solid var(--sun);border-radius:4px 10px 10px 4px;padding:8px 12px;margin:2px 0 16px}
#msg:empty{display:none}
.alt{margin-top:10px;color:var(--ink);line-height:1.6}
.alt small,.info small{color:#7a6a50;line-height:1.5}
details{border:1.5px dashed #cdbd95;border-radius:14px;padding:0 14px;margin:10px 0;background:#fffaf0;transition:background .2s}
details[open]{border-style:solid;border-color:var(--leaf);background:#f4f9ee}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:13px 0;font-family:Georgia,'Noto Serif Kannada',serif;font-size:17px;font-weight:700;color:var(--forest)}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";margin-left:auto;font-size:24px;line-height:1;color:var(--clay);transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
.info{font-size:14px;line-height:1.9;color:#3a3220;padding:0 0 12px 2px}
.info b{color:var(--leaf)}
footer{text-align:center;font-size:12px;line-height:1.6;color:#7a6a50;padding:6px 20px 28px;max-width:440px;margin:0 auto}
footer::before{content:"🌾 · 🌱 · 🌾";display:block;letter-spacing:.3em;margin-bottom:8px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 3px 0 #8e3a1d,0 0 0 0 rgba(196,85,47,.5)}70%{box-shadow:0 3px 0 #8e3a1d,0 0 0 14px rgba(196,85,47,0)}100%{box-shadow:0 3px 0 #8e3a1d,0 0 0 0 rgba(196,85,47,0)}}
@keyframes glow{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header>
<h1>🌱 Agri<span>vision</span></h1>
<p id="sub"></p>
<div class="lang">
<button id="b-en" onclick="setLang('en')">English</button>
<button id="b-kn" onclick="setLang('kn')">ಕನ್ನಡ</button>
</div>
<svg class="hills" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
<path d="M0 30 Q80 5 160 28 T320 22 T400 30 V60 H0Z" fill="#9bc07f"/>
<path d="M0 42 Q100 18 200 40 T400 36 V60 H0Z" fill="#4f8a55"/>
<path d="M0 52 Q120 36 230 50 T400 46 V60 H0Z" fill="#fbf5e6"/>
</svg>
</header>
<main>
<div class="card">
<button class="loc" id="locBtn" onclick="loc()"></button>
<button class="loc" id="micBtn" onclick="listen()"></button>
<div id="msg"></div>
<label id="distLabel"></label>
<select id="district" onchange="show()"></select>
<button id="showBtn" onclick="show()"></button>
</div>
<div class="card">
<b id="soilTitle"></b><br>
<label id="phLabel"></label>
<input id="ph" type="number" step="0.1" placeholder="e.g. 6.5" oninput="renderLand()">
<label id="npkLabel"></label>
<div class="row">
<input id="N" type="number" placeholder="N" oninput="renderLand()">
<input id="P" type="number" placeholder="P₂O₅" oninput="renderLand()">
<input id="K" type="number" placeholder="K₂O" oninput="renderLand()">
</div>
</div>
<div class="card" id="land" style="display:none"></div>
<div class="card" id="out" style="display:none"></div>
</main>
<footer id="foot"></footer>

function matchDistrict(name){
const n=String(name||'').toLowerCase().replace(/\bdistrict\b/g,'').trim();
return OTHER_NAMES[n]||Object.keys(DISTRICTS).find(d=>d.toLowerCase()===n)||'';
}

function seasonLine(c){
const s=SEASONS[c];
if(!s)return '';
const names=s.split('').map(k=>SEASON_NAMES[lang][k]).join(', ');
return '📅 <b>'+t('season')+':</b> '+names+'<br>';
}

function infoHTML(c){
const btn='<br><button class="sm" onclick="speakCrop(\''+c+'\')">'+t('listenBtn')+'</button>';
const i=INFO[c];
if(!i)return '<div class="info">'+seasonLine(c)+t('noInfo')+btn+'</div>';
const n=i[8];
const npk=n?n[0]+' : '+n[1]+' : '+n[2]+' '+UNITS[lang][n[3]]:t('varies');
return '<div class="info">'+seasonLine(c)+
'🌡️ <b>'+t('temp')+':</b> '+i[0]+'–'+i[1]+' °C<br>'+

const f1=(x,d)=>isNaN(x)?'—':x.toFixed(d);
function mark(x,lo,hi){return x<lo?'⚠️ '+t('below'):x>hi?'⚠️ '+t('above'):'✅ '+t('within')}
// Common Indian soil test ratings (kg/ha): [low below, high above]
const NPK_LV={N:[280,560],P:[23,57],K:[145,337]};
function level(k,v){
const r=NPK_LV[k];
return v<r[0]?t('low'):v<=r[1]?t('med'):t('high');
}

let h='<b>'+t('landTitle')+'</b><div class="info">'+
'📍 <b>'+t('landPlace')+':</b> '+(L.place||'—')+'<br>'+
'🧭 '+L.la.toFixed(5)+', '+L.lo.toFixed(5)+' ('+T[lang].acc(L.acc)+')'+(L.acc>100?'<br>⚠️ '+t('accWeak'):'')+'<br>'+
'🌤️ <b>'+t('nowLbl')+':</b> '+f1(L.tNow,0)+' °C, '+f1(L.hNow,0)+' %<br>'+
'🌡️ <b>'+t('tAvgLbl')+':</b> '+f1(L.tAvg,1)+' °C<br>'+
'💧 <b>'+t('hAvgLbl')+':</b> '+f1(L.hAvg,0)+' %<br>'+
'🌧️ <b>'+t('rainLbl')+':</b> '+f1(L.rain,0)+' mm<br>'+
'🧪 <b>'+t('phLbl')+':</b> '+f1(ph,1)+'<br>'+
'🧬 <b>'+t('nTotLbl')+':</b> '+f1(L.nTot,2)+' g/kg<br><small>'+t('nTotNote')+'</small><br>';
const nv={N:parseFloat($('N').value),P:parseFloat($('P').value),K:parseFloat($('K').value)};
const names={N:t('nN'),P:t('nP'),K:t('nK')};
let any=false;
['N','P','K'].forEach(k=>{if(!isNaN(nv[k])){any=true;h+='🌱 <b>'+names[k]+':</b> '+nv[k]+' kg/ha → '+level(k,nv[k])+'<br>'}});
h+=any?'':'<small>'+t('npkEnter')+'</small><br>';
h+='<small>'+t('npkNote')+'</small></div>';

// Rank crops by how many of the four land factors fall in the crop's range
const rec=[];
for(const c in INFO){
const i=INFO[c];
const fs=[[L.tAvg,i[0],i[1],'🌡️',t('temp'),' °C'],[L.hAvg,i[2],i[3],'💧',t('hum'),' %'],[L.rain,i[4],i[5],'🌧️',t('rain'),' mm'],[ph,i[6],i[7],'🧪','pH','']];
let ok=0,n=0,close=0;
fs.forEach(a=>{const x=a[0],lo=a[1],hi=a[2];if(isNaN(x))return;n++;const d=x<lo?lo-x:x>hi?x-hi:0;if(!d)ok++;close+=Math.max(0,1-d/Math.max(hi-lo,1))});
if(n)rec.push({c:c,ok:ok,n:n,close:close,fs:fs});
}
rec.sort((a,b)=>(b.ok/b.n-a.ok/a.n)||(b.close/b.n-a.close/a.n));
REC=rec.slice(0,6);
const dd=$('district').value;
const local=c=>dd&&DISTRICTS[dd]&&DISTRICTS[dd].split(',').includes(c);
h+='<div style="margin-top:14px;padding-top:10px;border-top:1px solid #ddd"><b>'+t('recTitle')+'</b>'+
'<div class="row" style="margin-top:8px"><button onclick="readRec()">'+t('listenBtn')+'</button><button onclick="stopSpeak()">'+t('stopBtn')+'</button></div><div class="alt">';
REC.forEach(r=>{
let lines='';
r.fs.forEach(a=>{if(isNaN(a[0]))return;lines+=a[3]+' <b>'+a[4]+':</b> '+f1(a[0],a[4]==='pH'?1:0)+a[5]+' → '+mark(a[0],a[1],a[2])+' ('+a[1]+'–'+a[2]+')<br>'});
h+='<details><summary>'+(E[r.c]||'🌱')+' '+cropName(r.c)+' — '+r.ok+'/'+r.n+' ✅'+(local(r.c)?' 🏡':'')+'</summary><div class="info">'+lines+'</div>'+infoHTML(r.c)+'</details>';
});
h+='<small>🏡 = '+t('grownHere')+'<br>'+t('recNote')+'</small></div></div>';
o.innerHTML=h;
}

function iso(d){return d.toISOString().slice(0,10)}
async function getWeather(L){
const avg=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:NaN};
const sum=a=>a.filter(x=>x!=null).reduce((s,x)=>s+x,0);
try{
const u='https://api.open-meteo.com/v1/forecast?latitude='+L.la+'&longitude='+L.lo+'&current=temperature_2m,relative_humidity_2m&timezone=auto';
const j=await (await fetch(u)).json();
L.tNow=j.current.temperature_2m;L.hNow=j.current.relative_humidity_2m;
L.wOk=true;
}catch(e){}
try{
// Last 12 months. The archive is a few days behind, so end 5 days ago.
const end=new Date(Date.now()-5*864e5),start=new Date(end.getTime()-364*864e5);
const u='https://archive-api.open-meteo.com/v1/archive?latitude='+L.la+'&longitude='+L.lo+'&start_date='+iso(start)+'&end_date='+iso(end)+'&daily=temperature_2m_mean,relative_humidity_2m_mean,precipitation_sum&timezone=auto';
const j=await (await fetch(u)).json();
L.tAvg=avg(j.daily.temperature_2m_mean);
L.hAvg=avg(j.daily.relative_humidity_2m_mean);
L.rain=sum(j.daily.precipitation_sum);
L.wOk=true;
}catch(e){}
}

async function getSoil(L){
try{
const u='https://rest.isric.org/soilgrids/v2.0/properties/query?lon='+L.lo+'&lat='+L.la+'&property=phh2o&property=nitrogen&depth=0-5cm&depth=5-15cm&depth=15-30cm&value=mean';
const j=await (await fetch(u)).json();
const get=name=>{
const l=j.properties.layers.find(x=>x.name===name);
const v=l.depths.map(d=>d.values.mean).filter(x=>x!=null);
return v.length?v.reduce((s,x)=>s+x,0)/v.length:NaN;
};
const ph=get('phh2o')/10,n=get('nitrogen')/100;
if(isNaN(ph))throw 0;
$('ph').value=ph.toFixed(1);
L.nTot=n;
L.sOk=true;
}catch(e){}
}

async function findDistrict(L){
try{
const u='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=en&lat='+L.la+'&lon='+L.lo;
const r=await fetch(u);
if(!r.ok)return;
const a=(await r.json()).address||{};
L.place=[a.village||a.hamlet||a.town||a.suburb||a.city,a.state_district||a.county].filter(Boolean).join(', ');
if(a.state!=='Karnataka'){L.dState='notKa';return}
const d=matchDistrict(a.state_district||a.county);
if(d){L.dist=d;L.dState='ok';$('district').value=d}else L.dState='noMatch';
}catch(e){}
}

function loc(){
if(!navigator.geolocation){setMsg('noGeo');return}
setMsg('gathering');
navigator.geolocation.getCurrentPosition(async pos=>{
const L={la:pos.coords.latitude,lo:pos.coords.longitude,acc:Math.round(pos.coords.accuracy),place:'',dist:'',dState:'fail',wOk:false,sOk:false,tNow:NaN,hNow:NaN,tAvg:NaN,hAvg:NaN,rain:NaN,nTot:NaN};
LAND=L;
$('ph').value='';
await Promise.all([findDistrict(L),getWeather(L),getSoil(L)]);
if(L!==LAND)return;
if(!L.wOk)setMsg('weatherFail');
else if(!L.sOk)setMsg('soilFail');
else if(L.dist)setMsg('gpsDone');
else setMsg(L.dState==='notKa'?'notKa':L.dState==='noMatch'?'noMatch':'fail');
if(L.dist)show();
renderLand();
},()=>setMsg('blocked'),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

/* ---------- Voice: read aloud ---------- */
let voices=[];
function loadVoices(){if('speechSynthesis' in window)voices=speechSynthesis.getVoices()}
loadVoices();
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;

function speak(text){
if(!('speechSynthesis' in window)){setMsg('noTts');return}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
const code=lang==='kn'?'kn-IN':'en-IN';
u.lang=code;
const v=voices.find(x=>x.lang.replace('_','-').toLowerCase()===code.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang));
if(v)u.voice=v;
else if(voices.length&&t('noVoiceHint'))setMsg('noVoiceHint');
u.rate=0.9;
speechSynthesis.speak(u);
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}

function speechList(d){
return T[lang].title(distName(d))+'. '+DISTRICTS[d].split(',').map(cropName).join(', ');
}
function speechInfo(c){
const sp=SP[lang];
let s=cropName(c)+'. ';
const sn=SEASONS[c];
if(sn)s+=t('season')+': '+sn.split('').map(k=>SEASON_NAMES[lang][k].replace(/\s*\(.*?\)/g,'').replace(/\//g,',')).join(', ')+'. ';
const i=INFO[c];
if(!i)return s+t('noInfo');
s+=t('temp')+': '+sp.temp(i[0],i[1])+'. ';
s+=t('hum')+': '+sp.hum(i[2],i[3])+'. ';
s+=t('rain')+': '+sp.rain(i[4],i[5])+'. ';
s+=sp.phWord+': '+sp.ph(i[6],i[7])+'. ';
const n=i[8];
s+=n?sp.fert+': '+sp.n+' '+n[0]+', '+sp.p+' '+n[1]+', '+sp.k+' '+n[2]+', '+sp.units[n[3]]+'.':sp.fert+': '+t('varies')+'.';
return s;
}
function readList(){const d=$('district').value;if(d)speak(speechList(d))}
function readRec(){if(REC.length)speak(t('recTitle')+'. '+REC.slice(0,3).map(r=>cropName(r.c)).join(', '))}
function speakCrop(c){speak(speechInfo(c))}

/* ---------- Voice: speak a district or crop name ---------- */
const DIST_KEYS=[];
Object.keys(DISTRICTS).forEach(d=>{DIST_KEYS.push([d.toLowerCase(),d]);DIST_KEYS.push([DISTRICTS_KN[d],d])});
Object.keys(OTHER_NAMES).forEach(k=>DIST_KEYS.push([k,OTHER_NAMES[k]]));
Object.keys(VOICE_ALIASES).forEach(k=>DIST_KEYS.push([k,VOICE_ALIASES[k]]));
const CROP_KEYS=[];
Object.keys(CROPS_KN).forEach(c=>{CROP_KEYS.push([c,c]);CROP_KEYS.push([CROPS_KN[c],c])});
// Longest name wins, e.g. "ಕಡಲೆಕಾಯಿ" beats "ಕಡಲೆ"
function best(list,s){
let b=null;
list.forEach(([k,v])=>{if(k&&s.includes(k)&&(!b||k.length>b[0].length))b=[k,v]});
return b&&b[1];
}

function handleVoice(alts){
const texts=alts.map(a=>a.toLowerCase().trim());
setMsg('heard',alts[0]);
for(const s of texts){
const d=best(DIST_KEYS,s);
if(d){$('district').value=d;show();renderLand();speak(speechList(d));return}
}
for(const s of texts){
const c=best(CROP_KEYS,s);
if(c){showCrop(c);speak(speechInfo(c));return}
}
setMsg('noMatchVoice');
}

function listen(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){setMsg('noSpeech');return}
stopSpeak();
const r=new SR();
r.lang=lang==='kn'?'kn-IN':'en-IN';
r.interimResults=false;
r.maxAlternatives=3;
setMsg('listening');
r.onresult=e=>handleVoice(Array.from(e.results[0]).map(a=>a.transcript));
r.onerror=e=>setMsg(e.error==='not-allowed'||e.error==='service-not-allowed'?'micDenied':'noMatchVoice');
r.onend=()=>{if(msgKey==='listening')setMsg('noMatchVoice')};
try{r.start()}catch(e){setMsg('noMatchVoice')}
}

setLang(lang);
</script>
