<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrivision</title>
<style>
body{margin:0;font-family:sans-serif;background:#f1f8e9;color:#1b1b1b}
header{background:#2e7d32;color:#fff;padding:24px 16px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;opacity:.9}
main{max-width:420px;margin:-12px auto 30px;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
label{font-size:14px;color:#444}
input{width:100%;padding:10px;margin:4px 0 14px;box-sizing:border-box;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;background:#2e7d32;color:#fff;border:0;border-radius:8px;font-size:17px}
button.loc{background:#fff;color:#2e7d32;border:2px solid #2e7d32;margin-bottom:6px}
#msg{font-size:13px;color:#555;margin:6px 0 14px;min-height:16px}
.best{font-size:26px;font-weight:bold;color:#2e7d32}
.alt{margin-top:8px;color:#555}
footer{text-align:center;font-size:12px;color:#777;padding-bottom:20px}
</style></head><body>
<header><h1>🌱 Agrivision</h1><p>Smart crop recommendation</p></header>
<main>
<div class="card">
<button class="loc" onclick="loc()">📍 Use my location</button>
<div id="msg">Fills temperature, humidity, rainfall and estimated soil pH.</div>
<label>Temperature (°C)</label><input id="t" type="number" placeholder="e.g. 25">
<label>Humidity (%)</label><input id="h" type="number" placeholder="e.g. 80">
<label>Rainfall, last 30 days (mm)</label><input id="r" type="number" placeholder="e.g. 200">
<label>Soil pH (auto estimate, editable)</label><input id="p" type="number" step="0.1" placeholder="e.g. 6.5">
<button onclick="go()">Suggest crop</button>
</div>
<div class="card" id="out" style="display:none"></div>
</main>
<footer>Demo project · rule-based, not real agronomic advice</footer>
<script>
const C={
Rice:[20,35,60,100,150,300,5,7],Wheat:[10,25,40,70,50,100,6,7.5],
Maize:[18,30,50,80,60,110,5.5,7.5],Cotton:[22,35,50,80,60,120,6,8],
Sugarcane:[20,35,60,85,100,200,6,8],Potato:[10,22,60,85,50,100,5,6.5],
Tomato:[18,30,50,75,60,120,6,7],Banana:[22,35,70,90,100,250,5.5,7],
Coffee:[15,28,60,90,150,250,6,6.5],Mango:[24,35,40,70,75,250,5.5,7.5],
Groundnut:[22,32,40,70,50,120,5.5,7],Soybean:[20,30,50,80,60,120,6,7],
Millet:[25,35,30,60,40,90,5.5,7.5],Apple:[5,20,50,80,100,200,5.5,6.5],
Chickpea:[10,25,30,60,40,90,6,8.5],Jute:[24,37,70,90,150,250,6,7.5],
Tea:[13,30,70,90,150,300,4.5,5.5],
Lentil:[15,28,40,70,40,90,6,8],Pigeonpea:[20,35,40,70,60,150,5,7.5],
Mungbean:[25,35,50,80,50,110,6,7.5],Kidneybean:[15,25,50,80,60,150,5.5,6.5],
Pomegranate:[18,35,40,70,40,110,5.5,7.5],Grapes:[15,30,50,80,40,100,5.5,6.5],
Watermelon:[24,35,50,80,40,110,6,7],Papaya:[22,35,60,90,80,200,6,7],
Orange:[15,30,50,85,80,180,6,7.5],Coconut:[25,35,70,95,130,250,5.5,7],
Onion:[13,28,50,75,40,90,6,7],Chilli:[20,32,55,85,60,120,6,7],
Sunflower:[18,30,40,70,50,100,6,7.5],Mustard:[10,25,40,70,30,80,6,8],
Barley:[8,22,40,65,40,90,6,8],Sorghum:[24,36,35,65,40,100,5.5,8]};
const E={Rice:'🌾',Wheat:'🌾',Maize:'🌽',Cotton:'☁️',Sugarcane:'🎋',Potato:'🥔',Tomato:'🍅',Banana:'🍌',Coffee:'☕',Mango:'🥭',Groundnut:'🥜',Soybean:'🫘',Millet:'🌾',Apple:'🍎',Chickpea:'🫛',Jute:'🌿',Tea:'🍵',
Lentil:'🫘',Pigeonpea:'🫛',Mungbean:'🫛',Kidneybean:'🫘',Pomegranate:'🍎',Grapes:'🍇',Watermelon:'🍉',Papaya:'🧡',Orange:'🍊',Coconut:'🥥',Onion:'🧅',Chilli:'🌶️',Sunflower:'🌻',Mustard:'🌼',Barley:'🌾',Sorghum:'🌾'};
const $=id=>document.getElementById(id);
function loc(){
const m=$('msg');
if(!navigator.geolocation){m.textContent='Location is not supported on this device.';return}
m.textContent='Getting your location…';
navigator.geolocation.getCurrentPosition(async pos=>{
const la=pos.coords.latitude,lo=pos.coords.longitude;
try{
m.textContent='Getting weather…';
const u='https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+'&current=temperature_2m,relative_humidity_2m&daily=precipitation_sum&past_days=30&forecast_days=1&timezone=auto';
const j=await (await fetch(u)).json();
$('t').value=Math.round(j.current.temperature_2m);
$('h').value=Math.round(j.current.relative_humidity_2m);
$('r').value=Math.round(j.daily.precipitation_sum.reduce((a,b)=>a+(b||0),0));
}catch(e){m.textContent='Could not get weather. Type the values by hand.';return}
try{
m.textContent='Getting soil pH…';
const s='https://rest.isric.org/soilgrids/v2.0/properties/query?lon='+lo+'&lat='+la+'&property=phh2o&depth=0-5cm&depth=5-15cm&depth=15-30cm&value=mean';
const k=await (await fetch(s)).json();
const d=k.properties.layers[0].depths.map(x=>x.values.mean).filter(x=>x!=null);
if(!d.length)throw 0;
const v=d.reduce((a,b)=>a+b,0)/d.length/10;
$('p').value=v.toFixed(1);
m.textContent='Done! Estimated soil pH '+v.toFixed(1)+'. Change it if you have a soil test.';
}catch(e){$('p').value='6.5';m.textContent='Weather filled. Soil service unavailable, so pH is set to a typical 6.5. Change it if you know yours.'}
},()=>{m.textContent='Location blocked. Allow location in your browser, or type values by hand.'});
}
function go(){
const v=['t','h','r','p'].map(i=>parseFloat($(i).value));
const o=$('out');o.style.display='block';
if(v.some(isNaN)){o.innerHTML='Please fill all 4 boxes';return}
const s=[];
for(const k in C){const c=C[k];let n=0;
for(let i=0;i<4;i++){const lo=c[2*i],hi=c[2*i+1],m=(lo+hi)/2,w=(hi-lo)/2,d=Math.abs(v[i]-m)/w;n+=d<=1?2-d:-d}
s.push([k,n])}
s.sort((a,b)=>b[1]-a[1]);
o.innerHTML='Best match<div class="best">'+E[s[0][0]]+' '+s[0][0]+'</div><div class="alt">Also good: '+E[s[1][0]]+' '+s[1][0]+', '+E[s[2][0]]+' '+s[2][0]+'</div>';
}
</script></body></html>
