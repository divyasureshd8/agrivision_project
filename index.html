
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriVision - Smart Agriculture</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>🌱 AgriVision</h1>
        <p>Smart Agriculture and Crop Recommendation System</p>
    </header>

    <main>

        <!-- REGIONAL CROP RECOMMENDATION -->

        <section id="regionalCrops">

            <h2>🌾 Regional Crop Recommendation</h2>

            <label for="district">
                Select Karnataka District:
            </label>

            <select id="district">
                <option value="">Select District</option>
                <option value="Bagalkot">Bagalkot</option>
                <option value="Ballari">Ballari</option>
                <option value="Belagavi">Belagavi</option>
                <option value="Bengaluru Rural">Bengaluru Rural</option>
                <option value="Bengaluru Urban">Bengaluru Urban</option>
                <option value="Bidar">Bidar</option>
                <option value="Chamarajanagar">Chamarajanagar</option>
                <option value="Chikkaballapur">Chikkaballapur</option>
                <option value="Chikkamagaluru">Chikkamagaluru</option>
                <option value="Chitradurga">Chitradurga</option>
                <option value="Dakshina Kannada">Dakshina Kannada</option>
                <option value="Davanagere">Davanagere</option>
                <option value="Dharwad">Dharwad</option>
                <option value="Gadag">Gadag</option>
                <option value="Hassan">Hassan</option>
                <option value="Haveri">Haveri</option>
                <option value="Kalaburagi">Kalaburagi</option>
                <option value="Kodagu">Kodagu</option>
                <option value="Kolar">Kolar</option>
                <option value="Koppal">Koppal</option>
                <option value="Mandya">Mandya</option>
                <option value="Mysuru">Mysuru</option>
                <option value="Raichur">Raichur</option>
                <option value="Ramanagara">Ramanagara</option>
                <option value="Shivamogga">Shivamogga</option>
                <option value="Tumakuru">Tumakuru</option>
                <option value="Udupi">Udupi</option>
                <option value="Uttara Kannada">Uttara Kannada</option>
                <option value="Vijayanagara">Vijayanagara</option>
                <option value="Vijayapura">Vijayapura</option>
                <option value="Yadgir">Yadgir</option>
            </select>

            <button type="button"
                onclick="showRegionalCrops()">
                Show Regional Crops
            </button>

            <div id="regionalResult">
                Select a district to view suitable regional crops.
            </div>

        </section>


        <!-- AI CROP RECOMMENDATION -->

        <section id="aiRecommendation">

            <h2>🤖 AI Crop Recommendation</h2>

            <p>Enter your soil and climate details.</p>

            <div class="form-group">

                <label for="nitrogen">Nitrogen (N)</label>
                <input type="number" id="nitrogen"
                    placeholder="Enter Nitrogen" step="any">

                <label for="phosphorus">Phosphorus (P)</label>
                <input type="number" id="phosphorus"
                    placeholder="Enter Phosphorus" step="any">

                <label for="potassium">Potassium (K)</label>
                <input type="number" id="potassium"
                    placeholder="Enter Potassium" step="any">

                <label for="temperature">Temperature (°C)</label>
                <input type="number" id="temperature"
                    placeholder="Enter Temperature" step="any">

                <label for="humidity">Humidity (%)</label>
                <input type="number" id="humidity"
                    placeholder="Enter Humidity" step="any">

                <label for="ph">Soil pH</label>
                <input type="number" id="ph"
                    placeholder="Enter Soil pH" step="any">

                <label for="rainfall">Rainfall (mm)</label>
                <input type="number" id="rainfall"
                    placeholder="Enter Rainfall" step="any">

            </div>

            <button type="button" id="predictCrop">
                Predict Best Crop
            </button>

            <div id="predictionResult">
            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        <p>© 2026 AgriVision | Smart Agriculture System</p>
    </footer>


    <!-- CONNECT JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
