<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrivision</title>
<style>
body{margin:0;font-family:sans-serif;background:#f1f8e9;color:#1b1b1b}
header{background:#2e7d32;color:#fff;padding:24px 16px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;opacity:.9}
main{max-width:420px;margin:-12px auto 30px;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
label{font-size:14px;color:#444}
input,select{width:100%;padding:10px;margin:4px 0 14px;box-sizing:border-box;border:1px solid #bbb;border-radius:8px;font-size:16px;background:#fff;color:#1b1b1b}
button{width:100%;padding:12px;background:#2e7d32;color:#fff;border:0;border-radius:8px;font-size:17px}
button.loc{background:#fff;color:#2e7d32;border:2px solid #2e7d32;margin-bottom:6px}
#msg{font-size:13px;color:#555;margin:6px 0 14px;min-height:16px}
.best{font-size:26px;font-weight:bold;color:#2e7d32}
.alt{margin-top:8px;color:#555;line-height:1.6}
.local{margin-top:14px;padding-top:10px;border-top:1px solid #ddd}
.row{display:flex;gap:8px}
footer{text-align:center;font-size:12px;color:#777;padding:0 12px 20px}
</style></head><body>
<header><h1>🌱 Agrivision</h1><p>ML crop recommendation</p></header>
<main>
<div class="card">
<button class="loc" onclick="loc()">📍 Use my location</button>
<div id="msg">Fills temperature, humidity, rainfall and estimated soil pH.</div>
<label>District (choose, or use location; please check it)</label>
<select id="district"><option value="">Select district</option></select>
<label>Temperature (°C)</label><input id="temperature" type="number" placeholder="e.g. 25">
<label>Humidity (%)</label><input id="humidity" type="number" placeholder="e.g. 80">
<label>Rainfall, last 30 days (mm)</label><input id="rainfall" type="number" placeholder="e.g. 200">
<label>Yearly rainfall (mm), for the rule check</label><input id="annualRain" type="number" placeholder="From local rainfall records">
<label>Soil pH (auto estimate, editable)</label><input id="ph" type="number" step="0.1" placeholder="e.g. 6.5">
<label>Soil nutrients (optional, from a soil test)</label>
<div class="row">
<input id="N" type="number" placeholder="N">
<input id="P" type="number" placeholder="P">
<input id="K" type="number" placeholder="K">
</div>
<button onclick="go()">Suggest crop</button>
</div>
<div class="card" id="out" style="display:none"></div>
</main>
<footer>Gaussian Naive Bayes model · learning project, not agronomic advice<br>
Location is sent to Open-Meteo, SoilGrids and OpenStreetMap. District lookup © OpenStreetMap contributors.</footer>
<script>
const $=id=>document.getElementById(id);
const E={rice:'🌾',maize:'🌽',chickpea:'🫛',kidneybeans:'🫘',pigeonpeas:'🫛',mothbeans:'🫘',mungbean:'🫛',blackgram:'🫘',lentil:'🫘',pomegranate:'🍎',banana:'🍌',mango:'🥭',grapes:'🍇',watermelon:'🍉',muskmelon:'🍈',apple:'🍎',orange:'🍊',papaya:'🧡',coconut:'🥥',cotton:'☁️',jute:'🌿',coffee:'☕'};

// Not official rankings. Only Hassan and Chikkamagaluru were checked against sources.
const DISTRICTS={
'Bagalkote':'jowar,maize,wheat,sugarcane,pigeon pea,chickpea',
'Ballari':'rice,cotton,jowar,maize,chilli',
'Belagavi':'sugarcane,maize,jowar,soybean,rice',
'Bengaluru North':'ragi,maize,grapes,vegetables,mulberry',
'Bengaluru South':'ragi,mulberry,mango,coconut,banana',
'Bengaluru Urban':'ragi,vegetables,mango,grapes',
'Bidar':'soybean,pigeon pea,chickpea,jowar,sugarcane',
'Chamarajanagar':'maize,sugarcane,turmeric,banana,ragi',
'Chikkaballapura':'ragi,maize,grapes,mulberry,vegetables',
'Chikkamagaluru':'coffee,arecanut,black pepper,rice,coconut,cardamom,tea',
'Chitradurga':'maize,groundnut,ragi,onion,coconut,arecanut',
'Dakshina Kannada':'arecanut,coconut,rice,black pepper,cashew,rubber',
'Davanagere':'maize,rice,arecanut,cotton',
'Dharwad':'cotton,maize,soybean,wheat,chilli,chickpea',
'Gadag':'maize,green gram,onion,sunflower,chickpea,jowar',
'Hassan':'ragi,coconut,potato,rice,sugarcane,maize,coffee,black pepper',
'Haveri':'maize,cotton,rice,chilli,groundnut',
'Kalaburagi':'pigeon pea,jowar,chickpea,cotton,sugarcane',
'Kodagu':'coffee,black pepper,rice,cardamom,orange',
'Kolar':'ragi,tomato,mango,mulberry,vegetables',
'Koppal':'rice,maize,pearl millet,pomegranate,chickpea',
'Mandya':'sugarcane,rice,ragi,coconut,mulberry',
'Mysuru':'rice,ragi,sugarcane,tobacco,cotton,maize',
'Raichur':'rice,cotton,pigeon pea,jowar,chickpea',
'Shivamogga':'arecanut,rice,maize,black pepper,ginger',
'Tumakuru':'coconut,arecanut,ragi,groundnut,mango',
'Udupi':'rice,coconut,arecanut,cashew,black pepper',
'Uttara Kannada':'arecanut,rice,coconut,black pepper,banana',
'Vijayanagara':'maize,rice,jowar,cotton,sugarcane',
'Vijayapura':'jowar,pigeon pea,chickpea,grapes,sugarcane,pomegranate',
'Yadgir':'rice,cotton,pigeon pea,jowar,groundnut'
};
const OTHER_NAMES={bagalkot:'Bagalkote',bellary:'Ballari',belgaum:'Belagavi',bangalore:'Bengaluru Urban','bangalore urban':'Bengaluru Urban',bengaluru:'Bengaluru Urban','bangalore rural':'Bengaluru North','bengaluru rural':'Bengaluru North',ramanagara:'Bengaluru South',ramanagaram:'Bengaluru South',chamrajanagar:'Chamarajanagar',chamarajanagara:'Chamarajanagar',chikkaballapur:'Chikkaballapura',chikballapur:'Chikkaballapura',chikmagalur:'Chikkamagaluru',davangere:'Davanagere',dharwada:'Dharwad',gadaga:'Gadag',gulbarga:'Kalaburagi',coorg:'Kodagu',koppala:'Koppal',mysore:'Mysuru',raichuru:'Raichur',shimoga:'Shivamogga',tumkur:'Tumakuru',bijapur:'Vijayapura',yadagiri:'Yadgir'};
const MODEL_NAMES={pigeonpeas:'pigeon pea',mungbean:'green gram'};
const CHECKED=['Hassan','Chikkamagaluru'];
// Rule check (not ML): t=temperature, r=yearly rain, p=pH
const RULES={
'Coffee (Arabica)':{t:[15,25],r:[1600,2500],p:[6,6.5]},
'Coffee (Robusta)':{t:[20,30],r:[1000,2000],p:[6,6.5]},
'Black pepper':{t:[23,32],r:[1250,2000],p:[5.5,6.5]},
'Arecanut':{t:[14,36],r:[750,4500],p:[4.5,7.6]}
};

Object.keys(DISTRICTS).forEach(d=>$('district').add(new Option(d,d)));

let M=null;
fetch('crop_model.json').then(r=>r.json()).then(j=>M=j).catch(()=>{});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function matchDistrict(name){
const n=String(name||'').toLowerCase().replace(/\bdistrict\b/g,'').trim();
return OTHER_NAMES[n]||Object.keys(DISTRICTS).find(d=>d.toLowerCase()===n)||'';
}

let lookupId=0;
async function findDistrict(la,lo){
const id=++lookupId;
try{
const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=en&lat='+la+'&lon='+lo);
if(!r.ok)return;
const a=(await r.json()).address||{};
if(a.state!=='Karnataka')return;
const d=matchDistrict(a.state_district||a.county);
if(d&&id===lookupId&&!$('district').value)$('district').value=d;
}catch(e){}
}

async function loc(){
const m=$('msg');
if(!navigator.geolocation){m.textContent='Location is not supported on this device.';return}
m.textContent='Getting your location…';
navigator.geolocation.getCurrentPosition(async pos=>{
const la=pos.coords.latitude,lo=pos.coords.longitude;
$('district').value='';
$('annualRain').value='';
findDistrict(la,lo);
try{
m.textContent='Getting weather…';
const u='https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+'&current=temperature_2m,relative_humidity_2m&daily=precipitation_sum&past_days=30&forecast_days=1&timezone=auto';
const j=await (await fetch(u)).json();
$('temperature').value=Math.round(j.current.temperature_2m);
$('humidity').value=Math.round(j.current.relative_humidity_2m);
$('rainfall').value=Math.round(j.daily.precipitation_sum.reduce((a,b)=>a+(b||0),0));
}catch(e){m.textContent='Could not get weather. Type the values by hand.';return}
try{
m.textContent='Getting soil pH…';
$('ph').value='';
const s='https://rest.isric.org/soilgrids/v2.0/properties/query?lon='+lo+'&lat='+la+'&property=phh2o&depth=0-5cm&value=mean';
const j=await (await fetch(s)).json();
const v=j.properties.layers[0].depths[0].values.mean;
if(v==null)throw 0;
$('ph').value=(v/10).toFixed(1);
m.textContent='Done! Check pH and district, then tap Suggest crop.';
}catch(e){m.textContent='Weather filled. Could not get soil pH, please type it yourself.'}
},()=>{m.textContent='Location blocked or unavailable. Type values by hand.'});
}

function districtHTML(){
const d=$('district').value;
if(!d)return '';
const list=DISTRICTS[d].split(',').map(c=>(E[c]||'🌱')+' '+cap(c));
const note=CHECKED.includes(d)?'Checked against online sources; not an official ranking.':'Unverified starter list.';
return '<div style="margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #ddd"><b>Crops grown in '+d+' district</b><div class="alt">'+list.join('<br>')+'<br><small>'+note+'</small></div></div>';
}

function localHTML(sc){
const d=$('district').value;
if(!d)return '<div class="alt local">Select your district to see local crops.</div>';
const local=DISTRICTS[d].split(',');
const nameOf=k=>MODEL_NAMES[k]||k.toLowerCase();
const known=Object.keys(M.crops).map(nameOf);
const matches=sc.filter(a=>local.includes(nameOf(a[0]))).map(a=>(E[a[0]]||'🌱')+' '+cap(a[0])+' (model score '+a[1].toFixed(1)+'%)');
const missing=local.filter(c=>!known.includes(c)).map(cap);
return '<div class="alt local"><b>Model scores for '+d+' crops:</b><br>'+(matches.join('<br>')||'None')+'<br><b>Local crops the model can’t assess:</b><br>'+(missing.join(', ')||'None')+'<br><small>A low score does not prove a crop is unsuitable. The model does not use location or season.</small></div>';
}

function rulesHTML(){
const v={t:parseFloat($('temperature').value),r:parseFloat($('annualRain').value),p:parseFloat($('ph').value)};
const names={t:'Temperature',r:'Yearly rain',p:'pH'};
let h='<div class="local"><b>Rule-based check (not ML)</b>';
for(const crop in RULES){
h+='<div class="alt"><b>'+crop+'</b>';
for(const k in names){
const [lo,hi]=RULES[crop][k],x=v[k];
const s=isNaN(x)?'not entered':x<lo?'⚠️ below':x>hi?'⚠️ above':'✅ within';
h+='<br>'+names[k]+': '+s+' ('+lo+'–'+hi+')';
}
h+='</div>';
}
return h+'<small>Checks only these three factors. Today’s temperature may differ from the yearly climate. Drainage, shade, altitude and season are not checked.</small></div>';
}

function go(){
const o=$('out');o.style.display='block';
if(!M){o.innerHTML='Model not loaded. Make sure crop_model.json is in your repo, then refresh.';return}
const x={};M.cols.forEach(c=>x[c]=parseFloat($(c).value));
if(['temperature','humidity','rainfall','ph'].some(c=>isNaN(x[c]))){o.innerHTML='Please fill temperature, humidity, rainfall and pH.';return}
const sc=[];
for(const k in M.crops){
let l=0;
M.cols.forEach((c,i)=>{
if(isNaN(x[c]))return;
const mu=M.crops[k].mean[i],sd=Math.max(M.crops[k].std[i],0.01);
l+=-Math.log(sd)-Math.pow(x[c]-mu,2)/(2*sd*sd);
});
sc.push([k,l]);
}
const mx=Math.max(...sc.map(a=>a[1]));
let tot=0;sc.forEach(a=>{a[1]=Math.exp(a[1]-mx);tot+=a[1]});
sc.forEach(a=>a[1]=a[1]/tot*100);
sc.sort((a,b)=>b[1]-a[1]);
const f=a=>(E[a[0]]||'🌱')+' '+cap(a[0])+' ('+a[1].toFixed(0)+'%)';
o.innerHTML=districtHTML()+'Model match from your inputs<div class="best">'+f(sc[0])+'</div><div class="alt">Also possible:<br>'+f(sc[1])+'<br>'+f(sc[2])+'</div>'+localHTML(sc)+rulesHTML();
}
</script>
</body></html>
